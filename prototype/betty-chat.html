<title>בטי — צ'אט בטיחות</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen chat. Header with Betty, emergency strip, scrolling log, composer pinned at the bottom. */
:root {
  --bg: #F3F5F0;
  --surface: #FFFFFF;
  --ink: #121614;
  --muted: #4A5650;
  --line: #D5DBD4;
  --betty: #DDF3E7;
  --accent: #0B7A4B;
  --on-accent: #FFFFFF;
  --hivis: #FFD60A;
  --on-hivis: #121614;
  --alert-bg: #FFF1EE;
  --alert-ink: #8A1C0F;
  --alert-line: #E3A79E;
  --font: 'Rubik', 'Heebo', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1412; --surface: #19201D; --ink: #EEF2EE; --muted: #A9B6AF; --line: #2D3833;
    --betty: #17362A; --accent: #4FD69A; --on-accent: #0B1410; --hivis: #FFD60A; --on-hivis: #121614;
    --alert-bg: #33150F; --alert-ink: #FFC9BF; --alert-line: #7A3327; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1412; --surface: #19201D; --ink: #EEF2EE; --muted: #A9B6AF; --line: #2D3833;
  --betty: #17362A; --accent: #4FD69A; --on-accent: #0B1410; --hivis: #FFD60A; --on-hivis: #121614;
  --alert-bg: #33150F; --alert-ink: #FFC9BF; --alert-line: #7A3327; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
* { box-sizing: border-box; }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.head { display: flex; align-items: center; gap: 12px; padding-block: 14px; }
.head img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 3px solid var(--hivis); flex-shrink: 0; }
.head-text { flex: 1; min-width: 0; }
.head h1 { margin: 0; font-size: 22px; font-weight: 800; line-height: 1.2; }
.head p { margin: 0; font-size: 14px; color: var(--muted); }
.lang { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 500; cursor: pointer; }

.stripe { height: 8px; border-radius: 4px; background: repeating-linear-gradient(135deg, var(--hivis) 0 12px, #121614 12px 24px); }

.emergency { margin-top: 10px; padding: 10px 14px; border: 1.5px solid var(--alert-line); background: var(--alert-bg); color: var(--alert-ink); border-radius: 12px; font-size: 14px; }
.emergency strong { font-weight: 700; }
.emergency .nums { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 2px; }
.emergency .nums span { white-space: nowrap; }
.emergency b { font-size: 17px; font-variant-numeric: tabular-nums; user-select: all; }
.emergency.loud { font-size: 16px; border-width: 3px; }
.emergency.loud b { font-size: 22px; }

.log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-block: 16px; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.betty { align-self: flex-start; background: var(--betty); border-start-start-radius: 4px; }
.msg.user { align-self: flex-end; background: var(--surface); border: 1.5px solid var(--line); border-start-end-radius: 4px; }
.msg.note { align-self: center; max-width: 100%; background: none; color: var(--muted); font-size: 14px; text-align: center; padding: 0; }
.who { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; }
.chips button { min-height: 44px; padding: 8px 14px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; text-align: start; }
.chips button:hover { border-color: var(--accent); }

.composer { display: flex; gap: 8px; align-items: flex-end; padding-bottom: 8px; }
.composer label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.composer textarea { flex: 1; min-width: 0; min-height: 48px; max-height: 140px; resize: none; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); }
.composer button { min-height: 48px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 700; cursor: pointer; }
.composer button[disabled] { opacity: 0.55; cursor: not-allowed; }
.composer .stop { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }

.fine { margin: 0; padding-bottom: 12px; font-size: 12.5px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .log { scroll-behavior: smooth; } }
</style>

    var messages = [{ role: 'user', content: RULES }].concat(turns);

    sample(messages, {
      cache: false,
      signal: ctl.signal,
      onText: function (u) { body.textContent = clean(u.text); log.scrollTop = log.scrollHeight; }
    }).then(function (res) {
      var answer = clean(res.text);
      body.textContent = answer;
      turns.push({ role: 'assistant', content: answer });
      if (res.truncated) addMessage('note', t().truncated);
    }).catch(function (e) {
      var code = e && e.code;
      var partial = e && e.text ? clean(e.text) : '';
      if (code === 'refused') partial = '';
      if (partial) {
        body.textContent = partial;
        turns.push({ role: 'assistant', content: partial });
      } else {
        body.parentNode.remove();
        if (code !== 'cancelled') { turns.pop(); }
        else { turns.pop(); }
      }
      if (code !== 'cancelled') {
        addMessage('note', t().errors[code] || t().errors.other);
      }
      if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled') {
        sample = null;
        input.disabled = true;
      }
    }).then(function () {
      setBusy(false);
      log.scrollTop = log.scrollHeight;
      if (sample) input.focus();
    });
  }

  form.addEventListener('submit', function (ev) { ev.preventDefault(); ask(input.value); });
  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); ask(input.value); }
  });
  stopBtn.addEventListener('click', function () { if (ctl) ctl.abort(); });
  $('lang-btn').addEventListener('click', function () { lang = lang === 'he' ? 'en' : 'he'; applyLang(); });

  var sampleChecked = false;
  setBusy(false);
  applyLang();

  var ready = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('sample').catch(function () { return null; })
    : Promise.resolve(null);
  ready.then(function (fn) {
    sample = fn || null;
    sampleChecked = true;
    input.disabled = !sample;
    setBusy(false);
    if (!sample && !turns.length) addMessage('note', t().unavailable);
    renderChips();
  });
})();
</script>
